<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">RV</a>
  <nav class="site-nav" aria-label="Main navigation">
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
