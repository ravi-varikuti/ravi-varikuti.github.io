<figure class="research-figure research-demo">
  {% if include.demo.video and include.demo.video != '' %}
    <video controls playsinline preload="none" poster="{{ include.demo.poster | relative_url }}" aria-label="{{ include.demo.title | escape }}">
      <source src="{{ include.demo.video | relative_url }}" type="video/mp4">
      Your browser does not support embedded video. <a href="{{ include.demo.video | relative_url }}">Download the video</a>.
    </video>
  {% else %}
    <div class="research-video-placeholder">
      <img src="{{ include.demo.poster | relative_url }}" alt="{{ include.demo.title | escape }} experiment" loading="lazy">
      <span class="research-video-status">Video coming soon</span>
    </div>
  {% endif %}
  <figcaption><strong>{{ include.demo.title }}</strong>{{ include.demo.caption }}</figcaption>
</figure>
