---
layout: default
---
<article class="article prose">
  <header class="article-header">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← Blog</a>
    <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}{% if page.reading_time %} · {{ page.reading_time }} min read{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}
  </header>
  {{ content }}
</article>
